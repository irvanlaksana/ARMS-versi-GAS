// Both GAS callbacks are wrapped in a Promise. The overlay blocks duplicate actions.
function rpc(method, ...args) {
  ARMS.requests++;

    $$('button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled)').forEach(element => { element.dataset.rpcDisabled = 'true'; element.disabled = true; });

  document.body.setAttribute('aria-busy', 'true');

  return new Promise((resolve, reject) => {
    if (!window.google || !google.script || !google.script.run) { reject(new Error('Buka aplikasi melalui URL deployment Google Apps Script.')); return; }
    google.script.run.withSuccessHandler(result => {
      if (result && result.status === 'success') resolve(result.data);
      else reject(new Error(result && result.message ? result.message : 'Respons server tidak valid.'));
    }).withFailureHandler(error => reject(new Error(error.message || 'Tidak dapat menghubungi server.')))[method](...args);

    ARMS.requests = Math.max(0, ARMS.requests - 1);
    $('#network-loader').hidden = ARMS.requests === 0;
    if (!ARMS.requests) {
      $$('[data-rpc-disabled]').forEach(element => { element.disabled = false; delete element.dataset.rpcDisabled; });

    }
    document.body.setAttribute('aria-busy', ARMS.requests ? 'true' : 'false');

function renderDashboard() {

  const payments = db.payments.filter(p => String(p.date).startsWith(ARMS.period));

function chartHTML() {

function filteredRows(entity, scope) {
  const query = (ARMS.query[scope] || '').toLowerCase(), filters = ARMS.filters[scope] || {};

    const c = entity === 'cases' ? record : record.caseId ? recordById('cases', record.caseId) : null;
    const customer = customerFor(c);
    const searchable = Object.values(record).filter(value => typeof value !== 'object').join(' ') + ' ' + (customer ? customer.name + ' ' + customer.nik : '') + ' ' + (c ? c.number + ' ' + c.client : '');

    return collectionMatch && searchable.toLowerCase().includes(query) && (!filters.industry || record.industry === filters.industry) && (!filters.status || record.status === filters.status || record.type === filters.status || (entity === 'customers' && customerProcessClient(record.id).label === filters.status)) && (!filters.bucket || record.bucket === filters.bucket) && (!filters.clientType || record.clientType === filters.clientType) && (!filters.accountId || record.accountId === filters.accountId) && (!filters.month || String(record.date).startsWith(filters.month));

function download(filename, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type: type || 'application/json' }));
  const anchor = document.createElement('a'); anchor.href = url; anchor.download = filename; document.body.appendChild(anchor); anchor.click(); anchor.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function csvDownload(filename, rows) {
  const csv = '\uFEFF' + rows.map(row => row.map(value => {
    const text = String(value == null ? '' : value), safe = /^[=+@-]/.test(text) && typeof value !== 'number' ? "'" + text : text;
    return '"' + safe.replace(/"/g, '""') + '"';
  }).join(',')).join('\r\n');
  download(filename, csv, 'text/csv;charset=utf-8;'); toast('File CSV berhasil diunduh.');
}

  if (action === 'remove-personnel-document' && ARMS.form && !ARMS.form.documentBusy) { clearPersonnelDocument(button.dataset.kind || 'ktp'); return; }
  if (action === 'remove-workspace-letterhead') { setWorkspaceLetterhead(null); return; }
  if (action === 'client-step') { changeClientStep(n(button.dataset.step), true); return; }
  if (action === 'client-back') { if (ARMS.form.clientStep) changeClientStep(0, false); else closeDialog(); return; }
  if (action === 'toggle-reminders') { ARMS.remindersExpanded = !ARMS.remindersExpanded; ARMS.reminderPage = 1; renderReminderSection(); return; }
  if (action === 'reminder-page') { ARMS.reminderPage = n(button.dataset.page); renderReminderSection(); return; }
  if (action === 'sk-report') { const l = recordById('letters', id); if (l) openForm('collections', null, { letterId: l.id, caseId: l.caseId, personnelId: l.personnelId, activityDate: crmToday(), actionPlan: 'Laporan perkembangan penugasan ' + l.number }); return; }
  if (action === 'download-letter-pdf') { downloadLetterPdf(id); return; }
  if (action === 'clear-letter-pdf') { letterPdfState = null; renderLetterPdfForm(); return; }
  if (proposalActions(button)) return;
  if (crmActions(button)) return;
  if (action === 'add' || action === 'edit') return openForm(entity, id || undefined);
  if (action === 'customer-step') return setCustomerStep(n(button.dataset.step), true);
  if (action === 'customer-back') { const step = ARMS.form.customerState.step; return step ? setCustomerStep(step - 1, false) : closeDialog(); }
  if (action === 'account-tab') { ARMS.accountsTab = button.dataset.tab; renderAccountsModule(); return; }
  if (action === 'record-source-fee') { const source = financeSourcesClient().find(s => s.type === button.dataset.type && s.id === id); if (source) openForm('transactions', null, { sourceType: source.type, sourceId: source.id, amount: source.remaining, description: 'Penerimaan fee ' + source.number }); return; }
  if (action === 'toggle-customer-region') return toggleCustomerRegion();
  if (action === 'retry-customer-region') { loadCustomerRegions(); loadCustomerDistricts(); return; }
  if (action === 'remove-customer-photo') return removeCustomerPhoto(button.dataset.kind);
  if (action === 'customer-document') return downloadCustomerDocument(id, button.dataset.kind);
  if (action === 'detail') return openDetail(entity, id);
  if (action === 'delete') return confirmDeletion(entity, id);
  if (action === 'confirm-delete') return deleteConfirmed();
  if (action === 'letter') return openLetter(id);
  if (action === 'case-letter') return openLetter(null, id);
  if (action === 'case-payment') return openForm('payments', null, { caseId: id });
  if (action === 'customer-case') return openForm('cases', null, { customerId: id, asset: (recordById('customers', id) || {}).vehicle || '' });
  if (action === 'back-letters') { ARMS.letter = null; letterPdfState = null; renderLetters(); navigate('letters'); return; }
  if (action === 'add-manual') return addManual();
  if (action === 'remove-manual') { button.closest('.manual-row').remove(); recalculatePayment(); return; }
  if (action === 'page') { ARMS.pages[button.dataset.scope] = Math.max(1, n(button.dataset.page)); rerenderTable(button.dataset.scope); return; }
  if (action === 'bucket') { ARMS.filters.cases = { bucket: button.dataset.bucket }; ARMS.pages.cases = 1; renderEntity('cases'); navigate('cases'); return; }
  if (action === 'export') return exportEntity(entity, button.dataset.scope);
  if (action === 'report-export') return exportReport();
  if (action === 'backup') { download('ARMS-backup-' + today() + '.json', JSON.stringify(ARMS.db, null, 2)); toast('Cadangan berhasil diunduh. Simpan file dengan aman.'); }
});
document.addEventListener('input', event => {
  const input = event.target;
  if (input.dataset.crmSearch && ARMS.form) { crmSearchInput(input); return; }
  if (input.dataset.proposalField !== undefined || input.dataset.proposalPartner !== undefined) { proposalFieldInput(input); return; }
  if (input.id === 'global-search') return globalSearch(input.value);
  if (input.dataset.query) { ARMS.query[input.dataset.query] = input.value; ARMS.pages[input.dataset.query] = 1; rerenderTable(input.dataset.query); return; }
  if (input.closest('#entity-form') && ARMS.form) {
    if (ARMS.form.entity === 'customers' || ARMS.form.entity === 'clients') {
      if (['installment', 'penalty'].includes(input.name)) formControl('total').value = rupiah(n(formControl('installment').value) + n(formControl('penalty').value));
      if (['regency', 'district'].includes(input.name)) ARMS.form.customerState[input.name] = input.value;
      if (input.name === 'plate') input.value = input.value.toUpperCase();
      if (input.name === 'code') input.value = input.value.toUpperCase();
    }
    if (ARMS.form.entity === 'payments') recalculatePayment();
    if (ARMS.form.entity === 'executions') recalculateExecution();
  }
  if (input.closest('#letter-form') && ARMS.letter && input.name) { ARMS.letter[input.name] = input.value; ARMS.letter.saved = false; updateLetterFormState(); }
});
document.addEventListener('change', event => {
  const input = event.target;
  if (input.id === 'bulk-file') { chooseBulkFile(input); return; }
  if (input.id === 'workspace-logo-file' || input.id === 'workspace-letterhead-file') {
    const file = input.files && input.files[0], kind = input.id === 'workspace-letterhead-file' ? 'letterhead' : 'logo';
    input.value = '';
    if (file) setWorkspaceImage(file, kind);
    return;
  }
  if (input.id === 'personnel-ktp-file' || input.id === 'personnel-sppi-file') { selectPersonnelDocument(input, input.id === 'personnel-sppi-file' ? 'sppi' : 'ktp'); return; }
  if (input.id === 'letter-pdf-file') { chooseLetterPdf(input); return; }
  if (input.dataset.proposalField !== undefined || input.dataset.proposalPartner !== undefined) { proposalFieldInput(input); return; }
  if (input.dataset.crmSearch && ARMS.form) { crmSearchInput(input); return; }
  if (input.dataset.customerPhoto) { selectCustomerPhoto(input); return; }
  if (input.dataset.filterScope) { const scope = input.dataset.filterScope; ARMS.filters[scope] = Object.assign({}, ARMS.filters[scope] || {}, { [input.dataset.filterKey]: input.value }); ARMS.pages[scope] = 1; rerenderTable(scope); }
  if (input.id === 'period' && input.value) { ARMS.period = input.value; if (ARMS.db) { renderDashboard(); renderReminderSection(); renderReports(); } }
  if (input.closest('#entity-form') && ARMS.form) {
    if (FINANCE_ENTITIES.includes(ARMS.form.entity)) financeChanged(input);
    if (['customers', 'clients'].includes(ARMS.form.entity) && ['regencyId', 'districtId', 'regency', 'district'].includes(input.name)) customerRegionChanged(input);
    if (ARMS.form.entity === 'cases' && input.name === 'customerId') updateRecoveryFields();
    if (ARMS.form.entity === 'collections') updateCollectionFields();
    if (ARMS.form.entity === 'payments') recalculatePayment();
  }
  if (input.closest('#letter-form') && ARMS.letter && input.name) {
    ARMS.letter[input.name] = input.value; ARMS.letter.saved = false;
    if (input.name === 'customerId') ARMS.letter.caseId = (ARMS.db.cases.find(c => c.customerId === input.value) || {}).id || '';
    if (input.name === 'caseId' || input.name === 'customerId') applyLetterCaseDefaults();
    if (input.name === 'caseId' || input.name === 'customerId') renderLetters(); else updateLetterFormState();
  }
});
document.addEventListener('submit', event => {
  event.preventDefault();
  if (event.target.id === 'entity-form') submitEntity(event.target, event.submitter && event.submitter.value === 'payment' ? 'payment' : '');
  if (event.target.id === 'letter-form') submitLetter(event.target);
  if (event.target.id === 'letter-pdf-form') submitLetterPdf();
  if (event.target.id === 'settings-form') submitSettings(event.target);
});
document.addEventListener('keydown', event => {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); $('#global-search').focus(); }
  if (event.key === 'Escape') { $('#global-results').hidden = true; $('#sidebar').classList.remove('open'); $('#mobile-scrim').hidden = true; }
  if (event.key === 'Enter' && event.target.id === 'global-search') { const first = $('#global-results button'); if (first) { event.preventDefault(); first.click(); } }
});
$('#dialog').addEventListener('cancel', event => { if (ARMS.locked) event.preventDefault(); });
$('#dialog').addEventListener('click', event => { if (event.target === $('#dialog')) { const rect = $('#dialog').getBoundingClientRect(); if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) closeDialog(); } });
$('#mobile-menu').addEventListener('click', () => { $('#sidebar').classList.toggle('open'); $('#mobile-scrim').hidden = !$('#sidebar').classList.contains('open'); });
$('#mobile-scrim').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#mobile-scrim').hidden = true; });
$('#primary-action').addEventListener('click', () => {
  if (!ARMS.db || ARMS.locked || ARMS.requests) return;
  if (ARMS.module === 'reports') return exportReport();
  if (ARMS.module === 'letters') return openLetter();
  if (ARMS.module === 'proposals') return openProposal();
  if (ARMS.module === 'accounts') return openForm('transactions');
  if (ARMS.module === 'collections' && (ARMS.filters.collections || {}).caseId) { const id = ARMS.filters.collections.caseId; return openForm('collections', null, { caseId: id, personnelId: (assigneeFor(id) || {}).id || '' }); }
  openForm(ARMS.module === 'dashboard' ? 'cases' : ARMS.module);
});
$('#period').value = ARMS.period;
setInterval(() => { if (ARMS.db && ARMS.module === 'dashboard') renderReminderSection(); }, 60000);
fillIcons();
reloadData().catch(error => {
  $('#connection-status').textContent = 'Koneksi belum tersedia';
  $('#boot-error').innerHTML = '<strong>Workspace belum dapat dimuat.</strong><br>' + escapeHTML(error.message) + '<br><button class="btn" data-action="refresh">' + icon('refresh') + 'Coba lagi</button>';
  $('#boot-error').hidden = false;
});
</script>
