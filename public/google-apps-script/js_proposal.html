function proposalTokens() {
  const p = ARMS.proposal || {}, s = (ARMS.db && ARMS.db.settings) || {};

    agensi: s.agency || '', klien: p.clientName || p.recipient || '', nomor: p.number || '[Nomor otomatis]',

}
/** Ganti token {agensi}, {klien}, dst. lalu escape agar aman dirender. */
function proposalText(value) {
  const tokens = proposalTokens();

function renderProposals() {
  const container = $('#module-proposals');

  if (!ARMS.proposal) {
    container.innerHTML = '<section class="panel no-print" id="proposals-container">' + proposalsIntroHTML() + tableHTML('proposals', 'proposals') + '</section>';
    return;
  }
  renderProposalEditor();

/* ------------------------------- editor ---------------------------------- */
function pfield(label, path, value, options) {
  options = options || {};
  const transform = options.transform ? ' data-proposal-transform="' + escapeHTML(options.transform) + '"' : '';
  const attrs = ' data-proposal-field="' + escapeHTML(path) + '"' + transform + (options.required ? ' required' : '') + (options.maxLength ? ' maxlength="' + options.maxLength + '"' : '') + (options.placeholder ? ' placeholder="' + escapeHTML(options.placeholder) + '"' : '') + (options.type === 'number' ? ' min="0" step="1"' : '');
  let control;
  if (options.options) control = '<select' + attrs + '>' + options.options.map(option => { const item = typeof option === 'string' ? { value: option, label: option } : option; return '<option value="' + escapeHTML(item.value) + '"' + (String(item.value) === String(value == null ? '' : value) ? ' selected' : '') + '>' + escapeHTML(item.label) + '</option>'; }).join('') + '</select>';
  else if (options.textarea) control = '<textarea' + attrs + ' rows="' + (options.rows || 3) + '">' + escapeHTML(value == null ? '' : value) + '</textarea>';
  else if (options.type === 'checkbox') control = '<input type="checkbox" data-proposal-field="' + escapeHTML(path) + '" data-proposal-transform="boolean"' + (value ? ' checked' : '') + '>';
  else control = '<input' + attrs + ' type="' + (options.type || 'text') + '" value="' + escapeHTML(value == null ? '' : value) + '">';
  return '<label class="field ' + (options.full ? 'span-2 ' : '') + (options.type === 'checkbox' ? 'check-field' : '') + '"><span>' + escapeHTML(label) + (options.required ? ' *' : '') + '</span>' + control + (options.hint ? '<small>' + escapeHTML(options.hint) + '</small>' : '') + '</label>';
}

function proposalPartnerCardHTML(person, doc) {

function proposalBlockHTML(block) {
  if (!block || typeof block !== 'object') return '';
  if (block.type === 'letterhead') return proposalLetterheadHTML(block);
  if (block.type === 'heading') return '<h' + ([1, 2, 3].indexOf(Number(block.level)) >= 0 ? Number(block.level) + 1 : 3) + ' class="proposal-heading level-' + (Number(block.level) || 2) + '">' + proposalHTML(block.text) + '</h' + ([1, 2, 3].indexOf(Number(block.level)) >= 0 ? Number(block.level) + 1 : 3) + '>';
  if (block.type === 'paragraph') return '<p class="proposal-paragraph" style="text-align:' + (block.align === 'center' ? 'center' : 'justify') + '">' + proposalHTML(block.text) + '</p>';
  if (block.type === 'bullets') {
    const items = (block.items || []).filter(item => String(item).trim());
    if (!items.length) return '';
    const tag = block.ordered ? 'ol' : 'ul';
    return '<' + tag + ' class="proposal-list">' + items.map(item => '<li>' + proposalHTML(item) + '</li>').join('') + '</' + tag + '>';
  }
  if (block.type === 'pairs') {
    const rows = (block.rows || []).filter(row => row && (row.label || row.value));
    if (!rows.length) return '';
    return (block.title ? '<h4 class="proposal-table-title">' + proposalHTML(block.title) + '</h4>' : '') + '<table class="proposal-pairs"><tbody>' + rows.map(row => '<tr><th>' + proposalHTML(row.label) + '</th><td>' + proposalHTML(row.value) + '</td></tr>').join('') + '</tbody></table>';
  }
  if (block.type === 'table') {
    const columns = block.columns || [], rows = block.rows || [];
    if (!columns.length) return '';
    return (block.title ? '<h4 class="proposal-table-title">' + proposalHTML(block.title) + '</h4>' : '') + '<table class="proposal-table"><thead><tr>' + columns.map(column => '<th>' + proposalHTML(column) + '</th>').join('') + '</tr></thead><tbody>' + rows.map(row => '<tr>' + columns.map((column, ci) => '<td>' + proposalHTML((row || [])[ci]) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
  }
  if (block.type === 'partners') {
    const ids = proposalPartnerIds(ARMS.proposal);
    const cards = ids.map(id => {
      const person = recordById('personnel', id);
      return person ? proposalPartnerCardHTML(person, (ARMS.proposalDocs || {})[id]) : '';
    }).join('');
    return '<h4 class="proposal-table-title">' + proposalHTML(block.title || 'Tim & Mitra DC') + '</h4>' + (block.note ? '<p class="proposal-paragraph">' + proposalHTML(block.note) + '</p>' : '') + (cards ? '<div class="proposal-partners' + (block.showNik ? ' with-nik' : '') + '">' + cards + '</div>' : '<p class="proposal-empty">Belum ada mitra DC yang dipilih. Buka halaman ini pada editor dan pilih mitra.</p>');
  }
  if (block.type === 'signature') {
    return '<div class="proposal-signature">' + (block.city ? '<span class="signature-place">' + proposalHTML(block.city) + ', ' + escapeHTML(dateLabel(ARMS.proposal.date)) + '</span>' : '') + (block.label ? '<span class="signature-label">' + proposalHTML(block.label) + '</span>' : '') + '<span class="signature-org">' + escapeHTML((ARMS.db.settings || {}).agency || '') + '</span><div class="signature-space"></div><strong>' + proposalHTML(block.name) + '</strong><small>' + proposalHTML(block.position) + '</small></div>';
  }
  return '';
}

/* ------------------------------ interaksi -------------------------------- */
function proposalSetPath(path, value) {
  const parts = String(path).split('.');
  let target = ARMS.proposal;
  for (let i = 0; i < parts.length - 1; i++) {
    if (target == null) return;
    target = target[parts[i]];
  }
  if (target == null) return;
  target[parts[parts.length - 1]] = value;
}
function proposalFieldInput(input) {
  if (!ARMS.proposal) return;
  const partner = input.dataset.proposalPartner;
  if (partner) { toggleProposalPartner(partner, input.checked); return; }
  const path = input.dataset.proposalField;
  if (!path) return;
  const transform = input.dataset.proposalTransform;
  let value = transform === 'boolean' ? input.checked : input.value;
  if (transform === 'lines') value = String(input.value).split('\n').map(row => row.replace(/\s+$/, '')).filter(row => row.trim() !== '');
  if (transform === 'number') value = Number(value || 0);
  if (path === 'clientId') {
    const client = recordById('clients', value);
    ARMS.proposal.clientId = value;
    if (client) {
      ARMS.proposal.clientName = client.name;
      if (!ARMS.proposal.recipient) ARMS.proposal.recipient = 'Bapak/Ibu ' + (client.contactPerson || 'Head of Collection') + '\n' + client.name + (client.address ? '\n' + client.address : '');
    }
    renderProposalEditor();
    return;
  }
  proposalSetPath(path, value);
  ARMS.proposal.saved = false;
  showProposalError('');
  updateProposalState();
  renderProposalPaper();
  if (/^pages\.\d+\.title$/.test(path)) renderProposalPageTitles();
}
function renderProposalPageTitles() {
  const pages = proposalPageList(ARMS.proposal);
  $$('#module-proposals .proposal-page-row').forEach((row, index) => {
    const strong = row.querySelector('strong');
    if (!strong || !pages[index]) return;
    const page = pages[index];
    strong.textContent = page.kind === 'cover' ? 'Cover / Kop surat' : page.kind === 'toc' ? 'Daftar isi' : page.title || 'Halaman tanpa judul';
  });
}
function toggleProposalPartner(id, checked) {
  if (!ARMS.proposal) return;
  const list = Array.isArray(ARMS.proposal.partners) ? ARMS.proposal.partners : (ARMS.proposal.partners = []);
  const index = list.indexOf(id);
  if (checked && index < 0) {
    if (list.length >= 40) { toast('Maksimal 40 mitra per proposal.', true); const box = $('#module-proposals input[data-proposal-partner="' + id + '"]'); if (box) box.checked = false; return; }
    list.push(id);
  }
  if (!checked && index >= 0) list.splice(index, 1);
  ARMS.proposal.saved = false;
  updateProposalState();
  renderProposalPaper();
  const counter = $('#module-proposals .picker-head span');
  if (counter) counter.textContent = 'Pilih mitra DC / personel (' + list.length + ' terpilih)';
  $$('#module-proposals .partner-picker-row').forEach(row => { const box = row.querySelector('input'); row.classList.toggle('checked', !!(box && box.checked)); });
}
function proposalPage(index) { return proposalPageList(ARMS.proposal)[index]; }
function proposalRerender() { renderProposalEditor(); }

function proposalAddPage(kind) {
  const pages = proposalPageList(ARMS.proposal);
  if (pages.length >= 40) return toast('Maksimal 40 halaman per proposal.', true);
  if (kind === 'toc' && pages.some(page => page.kind === 'toc')) return toast('Halaman daftar isi sudah ada.', true);
  const page = { id: newProposalId(), kind: kind === 'toc' ? 'toc' : 'content', title: kind === 'toc' ? 'DAFTAR ISI' : '', subtitle: '', blocks: [] };
  const position = kind === 'toc' ? Math.min(1, pages.length) : pages.length;
  pages.splice(position, 0, page);
  ARMS.proposal.pages = pages; ARMS.proposal.saved = false; ARMS.proposalPage = position;
  proposalRerender();
}
function proposalMovePage(index, direction) {
  const pages = proposalPageList(ARMS.proposal), target = index + direction;
  if (target < 1 || target >= pages.length) return;
  const moved = pages.splice(index, 1)[0];
  pages.splice(target, 0, moved);
  if (pages[0].kind !== 'cover') pages[0].kind = 'cover';
  ARMS.proposal.saved = false; ARMS.proposalPage = target;
  proposalRerender();
}
function proposalRemovePage(index) {
  const pages = proposalPageList(ARMS.proposal);
  if (index <= 0 || index >= pages.length) return;
  pages.splice(index, 1);
  ARMS.proposal.saved = false; ARMS.proposalPage = Math.max(0, Math.min(index - 1, pages.length - 1));
  proposalRerender();
}
function proposalDuplicatePage(index) {
  const pages = proposalPageList(ARMS.proposal), source = pages[index];
  if (!source || pages.length >= 40) return toast('Maksimal 40 halaman per proposal.', true);
  const copy = JSON.parse(JSON.stringify(source));
  copy.id = newProposalId(); copy.kind = copy.kind === 'cover' ? 'content' : copy.kind === 'toc' ? 'content' : copy.kind;
  copy.title = (copy.title || '') + ' (salinan)';
  pages.splice(index + 1, 0, copy);
  ARMS.proposal.saved = false; ARMS.proposalPage = index + 1;
  proposalRerender();
}
function newBlock(type) {
  if (type === 'heading') return { type: 'heading', level: 2, text: 'Judul bagian' };
  if (type === 'paragraph') return { type: 'paragraph', text: '', align: 'justify' };
  if (type === 'bullets') return { type: 'bullets', ordered: false, items: [''] };
  if (type === 'pairs') return { type: 'pairs', title: '', rows: [{ label: '', value: '' }] };
  if (type === 'table') return { type: 'table', title: '', columns: ['Keterangan', 'Nilai'], rows: [['', '']] };
  if (type === 'partners') return { type: 'partners', title: 'Data Mitra DC / Field Collector', note: '', showKtp: true, showSppi: true, showNik: true };
  if (type === 'signature') return { type: 'signature', city: '{kota}', label: 'Hormat kami,', name: '{penandatangan}', position: '{jabatan}' };
  return { type: 'letterhead', full: true, caption: '' };
}
function proposalAddBlock(pageIndex, type) {
  const page = proposalPage(pageIndex);
  if (!page) return;
  page.blocks = Array.isArray(page.blocks) ? page.blocks : [];
  if (page.blocks.length >= 40) return toast('Maksimal 40 blok per halaman.', true);
  page.blocks.push(newBlock(type));
  ARMS.proposal.saved = false;
  proposalRerender();
}
function proposalMoveBlock(pageIndex, blockIndex, direction) {
  const page = proposalPage(pageIndex);
  if (!page || !Array.isArray(page.blocks)) return;
  const target = blockIndex + direction;
  if (target < 0 || target >= page.blocks.length) return;
  const moved = page.blocks.splice(blockIndex, 1)[0];
  page.blocks.splice(target, 0, moved);
  ARMS.proposal.saved = false;
  proposalRerender();
}
function proposalRemoveBlock(pageIndex, blockIndex) {
  const page = proposalPage(pageIndex);
  if (!page || !Array.isArray(page.blocks)) return;
  page.blocks.splice(blockIndex, 1);
  ARMS.proposal.saved = false;
  proposalRerender();
}
function proposalBlockAt(pageIndex, blockIndex) {
  const page = proposalPage(pageIndex);
  return page && Array.isArray(page.blocks) ? page.blocks[blockIndex] : null;
}
function proposalAddPair(pageIndex, blockIndex) {
  const block = proposalBlockAt(pageIndex, blockIndex);
  if (!block) return;
  block.rows = Array.isArray(block.rows) ? block.rows : [];
  if (block.rows.length >= 40) return toast('Maksimal 40 baris.', true);
  block.rows.push({ label: '', value: '' });
  ARMS.proposal.saved = false; proposalRerender();
}
function proposalRemovePair(pageIndex, blockIndex, rowIndex) {
  const block = proposalBlockAt(pageIndex, blockIndex);
  if (!block || !Array.isArray(block.rows) || block.rows.length <= 1) return;
  block.rows.splice(rowIndex, 1);
  ARMS.proposal.saved = false; proposalRerender();
}
function proposalTableRowAdd(pageIndex, blockIndex) {
  const block = proposalBlockAt(pageIndex, blockIndex);
  if (!block) return;
  block.rows = Array.isArray(block.rows) ? block.rows : [];
  if (block.rows.length >= 60) return toast('Maksimal 60 baris tabel.', true);
  block.rows.push((block.columns || []).map(() => ''));
  ARMS.proposal.saved = false; proposalRerender();
}
function proposalTableRowRemove(pageIndex, blockIndex, rowIndex) {
  const block = proposalBlockAt(pageIndex, blockIndex);
  if (!block || !Array.isArray(block.rows)) return;
  block.rows.splice(rowIndex, 1);
  ARMS.proposal.saved = false; proposalRerender();
}
function proposalTableColAdd(pageIndex, blockIndex) {
  const block = proposalBlockAt(pageIndex, blockIndex);
  if (!block) return;
  block.columns = Array.isArray(block.columns) ? block.columns : [];
  if (block.columns.length >= 8) return toast('Maksimal 8 kolom.', true);
  block.columns.push('Kolom ' + (block.columns.length + 1));
  (block.rows || []).forEach(row => row.push(''));
  ARMS.proposal.saved = false; proposalRerender();
}
function proposalTableColRemove(pageIndex, blockIndex) {
  const block = proposalBlockAt(pageIndex, blockIndex);
  if (!block || !Array.isArray(block.columns) || block.columns.length <= 1) return;
  block.columns.pop();
  (block.rows || []).forEach(row => row.pop());
  ARMS.proposal.saved = false; proposalRerender();
}

function openProposal(id) {
  if (!ARMS.db) return;
  const record = id ? recordById('proposals', id) : null;
  if (id && !record) return toast('Proposal tidak ditemukan. Muat ulang workspace.', true);
  ARMS.proposal = record ? cloneProposal(record) : newProposalDraft();
  ARMS.proposalPage = 0; ARMS.proposalError = '';
  closeDialog();
  renderProposals();
  navigate('proposals');
  const partners = proposalPartnerIds(ARMS.proposal);
  if (partners.length && partners.length <= 6) loadProposalPartnerFiles(false);
}
function closeProposalEditor() {
  if (ARMS.proposal && !ARMS.proposal.saved) ARMS.proposalDraftLost = true;
  ARMS.proposal = null;
  if (ARMS.db) renderProposals();
}
async function loadProposalPartnerFiles(notifyEmpty) {
  if (!ARMS.proposal || ARMS.proposalBusy) return;
  const ids = proposalPartnerIds(ARMS.proposal).slice(0, 12);
  if (!ids.length) { if (notifyEmpty !== false) toast('Pilih mitra DC terlebih dahulu pada blok Tim & Mitra.'); return; }
  ARMS.proposalBusy = true; updateProposalState();
  try {
    const files = await rpc('getPersonnelFiles', ids);
    ARMS.proposalDocs = ARMS.proposalDocs || {};
    (files || []).forEach(file => { ARMS.proposalDocs[file.id] = file; });
    renderProposalPaper();
    const missing = ids.filter(id => !ARMS.proposalDocs[id]);
    toast('Dokumen ' + (files || []).length + ' mitra dimuat.' + (missing.length ? ' ' + missing.length + ' mitra tidak ditemukan.' : '') + (ids.length < proposalPartnerIds(ARMS.proposal).length ? ' Pratinjau dibatasi 12 mitra.' : ''));
  } catch (error) { toast(error.message, true); }
  finally { ARMS.proposalBusy = false; updateProposalState(); }
}
async function saveProposal() {
  if (ARMS.locked || !ARMS.proposal || ARMS.proposalBusy) return;
  ARMS.locked = true;
  const draft = ARMS.proposal;
  try {
    const payload = JSON.parse(JSON.stringify(draft));
    delete payload.saved;
    const saved = await rpc(payload.id ? 'updateProposal' : 'addProposal', ...(payload.id ? [payload.id, payload] : [payload]));
    await reloadData();
    const stored = recordById('proposals', saved.id);
    ARMS.proposal = Object.assign(cloneProposal(stored || saved), { saved: true });
    ARMS.proposalError = '';
    renderProposalEditor();
    toast('Proposal berhasil disimpan.');
  } catch (error) { showProposalError(error.message); }
  finally { ARMS.locked = false; }
}
async function printProposal() {
  if (!ARMS.proposal || ARMS.proposalBusy) return;
  if (!ARMS.proposal.saved) {
    showProposalError('Simpan proposal terlebih dahulu agar nomor dan data mitra tercetak benar.');
    return;
  }
  await loadProposalPartnerFiles(false);
  renderProposalPaper();
  setTimeout(() => window.print(), 350);
}
function proposalActions(button) {
  const action = button.dataset.action;
  if (!action || action.indexOf('proposal-') !== 0) return false;
  if (!ARMS.db) return true;
  if (action === 'proposal-open') { openProposal(button.dataset.id); return true; }
  if (action === 'proposal-new') { openProposal(); return true; }
  if (action === 'proposal-back') { closeProposalEditor(); return true; }
  if (!ARMS.proposal) return true;
  const page = Number(button.dataset.page || 0), block = Number(button.dataset.block || 0), row = Number(button.dataset.row || 0), dir = Number(button.dataset.dir || 0);
  if (action === 'proposal-save') { saveProposal(); return true; }
  if (action === 'proposal-print') { printProposal(); return true; }
  if (action === 'proposal-load-photos') { loadProposalPartnerFiles(true); return true; }
  if (action === 'proposal-page-select') { ARMS.proposalPage = page; proposalRerender(); return true; }
  if (action === 'proposal-page-add') { proposalAddPage(button.dataset.kind); return true; }
  if (action === 'proposal-page-move') { proposalMovePage(page, dir); return true; }
  if (action === 'proposal-page-remove') { proposalRemovePage(page); return true; }
  if (action === 'proposal-page-duplicate') { proposalDuplicatePage(page); return true; }
  if (action === 'proposal-block-add') { proposalAddBlock(page, button.dataset.type); return true; }
  if (action === 'proposal-block-move') { proposalMoveBlock(page, block, dir); return true; }
  if (action === 'proposal-block-remove') { proposalRemoveBlock(page, block); return true; }
  if (action === 'proposal-pair-add') { proposalAddPair(page, block); return true; }
  if (action === 'proposal-pair-remove') { proposalRemovePair(page, block, row); return true; }
  if (action === 'proposal-table-row-add') { proposalTableRowAdd(page, block); return true; }
  if (action === 'proposal-table-row-remove') { proposalTableRowRemove(page, block, row); return true; }
  if (action === 'proposal-table-col-add') { proposalTableColAdd(page, block); return true; }
  if (action === 'proposal-table-col-remove') { proposalTableColRemove(page, block); return true; }
  return true;
}
</script>
